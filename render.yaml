databases:
  - name: securecam-db
    plan: free
    databaseName: securecam
    user: securecam

services:
  - type: web
    name: securecam
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: securecam-db
          property: connectionString
      # ntfy.sh topic — fill in on Render dashboard (optional, motion notifications)
      - key: NTFY_TOPIC
        sync: false
      # R2 credentials — fill these in on the Render dashboard after first deploy
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
